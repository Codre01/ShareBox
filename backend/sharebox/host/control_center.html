<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ShareBox</title>
  <link rel="stylesheet" href="./nocturne.css" />
  <style>
    body { margin: 0; background: var(--color-bg); color: var(--color-text); font-family: var(--font-body); }
    .shell { width: 100vw; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    .titlebar { display: flex; align-items: center; padding: 0 16px; height: 44px; flex: none; border-bottom: 1px solid var(--color-divider); }
    .layout { display: flex; flex: 1; min-height: 0; }
    .nav { width: 212px; flex: none; border-right: 1px solid var(--color-divider); padding: var(--space-4) var(--space-3); display: flex; flex-direction: column; gap: 2px; }
    .nav-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: var(--radius-md); cursor: pointer; color: var(--color-neutral-300); font-size: 13px; }
    .nav-item:hover { background: var(--color-neutral-800); }
    .nav-item.active { background: var(--color-accent-800); color: var(--color-accent-100); }
    .content { flex: 1; min-width: 0; overflow: auto; padding: var(--space-8) 40px; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--color-neutral-600); }
    .status-dot.on { background: #6bbf8a; box-shadow: 0 0 0 3px color-mix(in srgb, #6bbf8a 25%, transparent); }
    .status-dot.err { background: #d98989; }
    .mono { font-family: ui-monospace, monospace; font-size: 13px; }
  </style>
</head>
<body>
  <div class="shell">
    <div class="titlebar">
      <div style="flex:1;text-align:center;font-size:13px;color:var(--color-neutral-400);">ShareBox</div>
    </div>
    <div class="layout">
      <aside class="nav">
        <div style="font-family:var(--font-heading);font-weight:600;font-size:16px;padding:0 var(--space-2) var(--space-4);">ShareBox</div>
        <div class="nav-item active" data-nav="status" id="nav-status">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 12h4l2 7 6-14 2 7h4"/></svg>
          <span>Status</span>
        </div>
        <div class="nav-item" data-nav="devices" id="nav-devices">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4" y="3" width="10" height="16" rx="2"/><rect x="15" y="8" width="6" height="11" rx="1.5"/></svg>
          <span>Devices</span>
          <span id="device-count" style="margin-left:auto;font-size:11px;color:var(--color-neutral-500);">0</span>
        </div>
        <div class="nav-item" data-nav="clipboard" id="nav-clipboard">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="6" y="4" width="12" height="17" rx="2"/><rect x="9" y="2.5" width="6" height="3" rx="1"/></svg>
          <span>Clipboard</span>
        </div>
        <div class="nav-item" data-nav="settings" id="nav-settings">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="3.2"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/></svg>
          <span>Settings</span>
        </div>
        <div style="margin-top:auto;padding:var(--space-3) var(--space-2) 0;border-top:1px solid var(--color-divider);display:flex;align-items:center;gap:8px;">
          <div class="status-dot" id="nav-dot"></div>
          <span id="nav-running-label" style="font-size:12px;color:var(--color-neutral-400);">Starting…</span>
        </div>
      </aside>
      <main class="content" id="main"></main>
    </div>
  </div>

  <div class="dialog-backdrop" id="dialog" style="display:none;"></div>

  <script src="./control_center.js"></script>
</body>
</html>
