# Lint config for ShareBox (backend + desktop).
#
# Scoped to pyflakes and the pycodestyle error tiers: the rules that catch code
# that is actually broken (undefined names, unused imports, syntax problems)
# rather than style preferences. The existing codebase passes this cleanly, so
# CI is green from the start and a failure means something real.
#
# Deliberately NOT enabled by default:
#   B008  flags FastAPI's own Depends()/Query() defaults - false positives here
#   BLE001, S110  the codebase uses deliberate broad excepts around optional
#         subsystems (tray, mDNS, filesystem races); each has a comment
#   I001  import sorting, cosmetic and would touch nearly every file
#
# Tightening this is welcome, but as its own PR with the fixes included.

line-length = 100
target-version = "py312"

[lint]
select = ["E4", "E7", "E9", "F"]

[lint.per-file-ignores]
# Tests import fixtures across modules and shadow names by design.
"tests/**" = ["F811"]
