name: Feature request
description: Suggest an idea or enhancement
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What problem does this solve? Who benefits?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How you imagine it working. Rough is fine.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Windows host / Control Center
        - Web client (phone browser)
        - macOS host
        - Linux host
        - Packaging / releases
        - Docs
        - Security
        - Other
    validations:
      required: true
  - type: textarea
    id: extras
    attributes:
      label: Extra context
      description: Mockups, links, related issues (optional).
