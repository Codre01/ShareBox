name: Release

# Builds the Windows .exe and the Linux .deb for a tag and attaches them to a
# GitHub Release.
#
# The release is created as a DRAFT on purpose. docs/acceptance-checklist.md
# requires a manual pass on a real LAN with a phone, and neither artifact is
# code-signed. Automation does the building; a human still smoke-tests and
# presses Publish.
#
#   git tag v0.1.1 && git push origin v0.1.1
#
# or run it from the Actions tab against an existing tag.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (e.g. v0.1.1)"
        required: true

permissions:
  contents: write

env:
  SHAREBOX_DISABLE_WATCHER: "1"
  SHAREBOX_DISABLE_MDNS: "1"

jobs:
  # Ship the version the tag claims, not whatever pyproject happens to say.
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: check
        shell: bash
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          version="${tag#v}"
          echo "tag=$tag"         >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          fail=0
          for f in backend/pyproject.toml desktop/pyproject.toml; do
            declared=$(grep -m1 '^version' "$f" | cut -d'"' -f2)
            if [ "$declared" != "$version" ]; then
              echo "::error file=$f::$f declares $declared but the tag is $tag"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] || exit 1
          echo "Version $version matches both pyproject files"

      - name: Install backend
        run: python -m pip install -e "./backend[dev]"
      - name: Tests must pass before we build anything
        working-directory: backend
        run: python -m pytest -q

  build-linux:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install GTK stack
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-gi gir1.2-gtk-3.0 gir1.2-webkit2-4.1 \
            gir1.2-ayatanaappindicator3-0.1 dpkg-dev fakeroot
      - name: Build .deb
        run: ./build/build_linux.sh
        env:
          SHAREBOX_VERSION: ${{ needs.verify.outputs.version }}
      - name: Verify package
        run: |
          deb=$(ls build/output/*.deb)
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb" | grep -qE 'usr/bin/sharebox' || {
            echo "::error::launcher symlink missing from package"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: build/output/*.deb
          if-no-files-found: error

  build-windows:
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build .exe
        shell: pwsh
        run: .\build\build_windows.ps1 -SkipShortcut
      - name: Verify artifact
        shell: pwsh
        run: |
          if (-not (Test-Path build\output\ShareBox.exe)) {
            Write-Error "ShareBox.exe was not produced"; exit 1
          }
          Get-Item build\output\ShareBox.exe | Format-List Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: build/output/ShareBox.exe
          if-no-files-found: error

  release:
    needs: [verify, build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Neither artifact is code-signed, so give people a way to check what
      # they downloaded is what CI built.
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Notes come from --generate-notes, which uses the categories already
      # configured in .github/release.yml. docs/release-notes-template.md stays
      # the guide for hand-editing the draft before publishing.
      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists — replacing its assets"
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --title "ShareBox $TAG" \
              --generate-notes \
              --draft
          fi
          echo "Draft ready. Walk docs/acceptance-checklist.md, then publish."
